[project]
name = "pricing"
version = "0.1.0"
description = "San Antonio builder pricing tracker"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonpath-ng>=1.6",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
